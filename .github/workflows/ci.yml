name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and module builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Unit tests (the integration tests skip themselves without their -D properties)
        run: mvn -B verify
      - name: CDI module and CDI test WAR compile
        run: |
          mvn -B -DskipTests -DskipITs install
          (cd cdi && mvn -B -DskipTests install)
          (cd cdi-it && mvn -B package)

  integration:
    name: Integration tests on ${{ matrix.server }} (Docker)
    # Runs only when the repository variable MCP_SERVER_REPO is set, for example "your-name/jakarta-mcp-server".
    # Settings > Secrets and variables > Actions > Variables. Optional: MCP_SERVER_REF (branch or tag; default branch if empty)
    # and, if the server repository is private, the secret SERVER_REPO_TOKEN (a token that may read it).
    if: ${{ vars.MCP_SERVER_REPO != '' }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server: [payara, wildfly, liberty]
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MCP_SERVER_REPO }}
          ref: ${{ vars.MCP_SERVER_REF }}
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}
          path: server
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            client/**/pom.xml
            server/**/pom.xml
      - name: Build, start the containers, run all tests, stop the containers
        working-directory: client
        env:
          SERVER_REPO: ${{ github.workspace }}/server
        run: scripts/it.sh --server ${{ matrix.server }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.server }}
          path: |
            client/target/it-logs
            client/target/surefire-reports
            client/target/failsafe-reports
          if-no-files-found: ignore
