# The model behind every injected jakarta.ai.agent.LargeLanguageModel. Provider selection is implementation-specific in Jakarta Agentic AI 1.0; these are Payara's keys.
# No model is set here on purpose: give it with the environment variable PAYARA_AGENTIC_LLM_MODEL. The API key comes from ANTHROPIC_API_KEY.
payara.agentic.llm.provider=anthropic

# The agent stops asking the model after this many replies (environment variable AGENT_MAX_ROUNDS).
agent.max-rounds=8
